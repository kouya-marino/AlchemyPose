[build-system]
# 77 rather than 61 for PEP 639: the SPDX ``license`` string and ``license-files``
# below are a hard error on anything older, so the floor has to move with them.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemypose"
# Read from ``alchemypose.__version__`` — see [tool.setuptools.dynamic] below.
# Two hand-maintained copies of a release number drift, and the copy that drifts
# is the one nobody reads: the package says one thing, ``pip show`` another.
dynamic = ["version"]
description = "Whole-body human pose visualisation: 133 COCO-WholeBody keypoints from a photograph, as a typed Python library and a desktop application."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Floor only, no ceiling. The floor is 3.12 because the *development* toolchain
# needs it: numpy 2.5.2 ships type stubs written in 3.12 syntax, so mypy cannot
# even parse them under 3.11. There is no matching upper bound, because that
# reasoning says nothing about one — requires-python governs installation, and a
# ceiling here refuses `pip install` on every interpreter released after the one
# that happened to be current, which is most people. Measured rather than
# assumed: every dependency above already supports 3.13 and 3.14 (PySide6
# >=3.10,<3.15; numpy classified through 3.15; onnxruntime >=3.11 through 3.14;
# opencv-python-headless >=3.6; typer and platformdirs >=3.10), and the whole
# test suite passes on 3.14. See [tool.mypy] for why *its* number is different.
requires-python = ">=3.12"
authors = [{name = "Prashant Rawat"}]
keywords = [
    "pose-estimation",
    "human-pose-estimation",
    "wholebody",
    "coco-wholebody",
    "keypoints",
    "rtmw",
    "rtmpose",
    "onnx",
    "onnxruntime",
    "computer-vision",
    "pyside6",
    "qt",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.9,<6",
    "onnxruntime>=1.20,<2",
    "platformdirs>=4.0",
    "typer>=0.12,<1",
    "PySide6_Essentials>=6.8,<7",
]

[project.urls]
Homepage = "https://github.com/kouya-marino/AlchemyPose"
Source = "https://github.com/kouya-marino/AlchemyPose"
Issues = "https://github.com/kouya-marino/AlchemyPose/issues"
Changelog = "https://github.com/kouya-marino/AlchemyPose/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-qt>=4.4", "ruff>=0.6", "mypy>=1.11", "build>=1.0", "twine>=5.0", "av>=14"]
# Frame-accurate seeking. Without it, video falls back to OpenCV, which is
# already a base dependency and reads every format FFmpeg does, but seeks only
# as accurately as the container's index.
video = ["av>=14"]
threed = ["pyqtgraph>=0.13", "PyOpenGL>=3.1"]

[project.scripts]
alchemypose = "alchemypose.cli:app"

# No [project.gui-scripts] entry, deliberately. On Windows a gui-scripts wrapper
# is launched by pythonw.exe, which has no console: a second entry under this
# same name is a filename collision with the console script above, and one under
# a different name would point pythonw at a Typer app whose --help, --version,
# JSON output and error messages all write to a stdout that is not there. This
# entry point is a command line that happens to open a window when asked, not a
# window with a command line bolted on. Nothing about the arrangement is
# load-bearing on macOS or Linux, where the two script kinds are identical, and
# adding an entry point later is backwards compatible — so the cost of waiting
# for a Windows machine to try it on is nil, and the cost of shipping the wrong
# one is a burnt version number.

[tool.setuptools.dynamic]
# ``attr:`` is read out of the source with ast, not by importing the package, so
# this works with no dependency installed and cannot execute anything.
version = {attr = "alchemypose.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["alchemypose*"]

[tool.setuptools.package-data]
alchemypose = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "models: requires cached ONNX weights (skipped when absent)",
    "gui: needs a display; run with QT_QPA_PLATFORM=offscreen",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
# 3.12, deliberately, while requires-python above is an open-ended ">=3.12".
# The two numbers answer different questions and are meant to differ: this one
# is the language level mypy *analyses against*, a development target, and
# lowering it to 3.11 is what numpy's 3.12-syntax stubs make impossible. It is
# not a claim about what the package runs on. Checking against the floor is the
# strictest useful choice — code that type-checks as 3.12 is valid on 3.13 and
# 3.14, whereas checking against 3.14 would quietly let 3.14-only syntax through
# into a package that still installs on 3.12. So this stays put when the runtime
# range widens; it moves only when the *floor* moves. Please do not "fix" the
# apparent inconsistency by syncing them.
python_version = "3.12"
packages = ["alchemypose"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["cv2.*", "onnxruntime.*", "pyqtgraph.*"]
ignore_missing_imports = true
